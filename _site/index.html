<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shorten a URL — tiny.danu.cc</title>

    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
    <main>
        <h1 id="tinydanucc">tiny.danu.cc</h1>

<h2 id="a-simple-url-shortener">A simple URL shortener!</h2>

<form id="shorten-form">
    <input id="url" type="url" placeholder="https://example.com/..." required="" />
    <button type="submit">Shorten</button>
</form>

<div id="result"></div>

<footer>
    tiny.danu.cc
</footer>

<script>
const form = document.getElementById("shorten-form");
const input = document.getElementById("url");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    result.textContent = "Shortening…";

    try {
        const response = await fetch("https://api.tiny.danu.cc/create", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                url: input.value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Unable to shorten URL.");
        }

        result.innerHTML = "";

        const link = document.createElement("a");
        link.href = data.shortUrl;
        link.textContent = data.shortUrl;

        result.appendChild(link);
    } catch (error) {
        result.innerHTML =
            `<span class="error">${error.message}</span>`;
    }
});
</script>


    </main>
</body>
</html>
