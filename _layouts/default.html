<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{{ page.title | escape }} — {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if page.script %}
  <script type="module" src="{{ '/assets/scripts/' | append: page.script | relative_url }}"></script>
  {% endif %}
</head>
<body>
  <div class="shell">
    <main>{{ content }}</main>
    <footer><a href="https://tiny.danu.cc">tiny.danu.cc</a></footer>
  </div>
</body>
</html>
